name: ui_kit
description: App resources.
version: 0.0.10
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  design_system:
    git:
      url: git@github.com:tarek360/flutter_kit.git
      ref: 0.0.10
      path: flutter_kit/design_system

  ui_kit_interface:
    git:
      url: git@github.com:tarek360/flutter_kit.git
      ref: 0.0.10
      path: flutter_kit/ui_kit_interface

  dots_indicator: ^4.0.1
  flutter_animate: ^4.5.2
  top_snackbar_flutter: ^3.3.0
  figma_squircle: ^0.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  global_lints:
    git:
      url: git@github.com:tarek360/flutter_kit.git
      ref: 0.0.10
      path: flutter_kit/global_lints
flutter:

  fonts:
    - family: icons
      fonts:
        - asset: assets/icon_font/icons.ttf