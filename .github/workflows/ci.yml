name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Create local dependency overrides
        run: |
          root="${{ github.workspace }}/packages"
          write_overrides() {
            local pkg=$1; shift
            { echo "dependency_overrides:"
              for dep in "$@"; do printf "  %s:\n    path: ../%s\n" "$dep" "$dep"; done
            } > "$root/$pkg/pubspec_overrides.yaml"
          }
          write_overrides core              global_lints
          write_overrides design_system     global_lints
          write_overrides firebase_packages core global_lints
          write_overrides social_login      core global_lints
          write_overrides ui_kit            design_system ui_kit_interface global_lints
          write_overrides ui_kit_interface  design_system global_lints
          write_overrides user_auth         ui_kit_interface design_system core global_lints

          root="${{ github.workspace }}"
          { echo "dependency_overrides:"
            for pkg in calendar_utils core design_system firebase_packages \
                       social_login ui_kit ui_kit_interface user_auth global_lints; do
              printf "  %s:\n    path: ../packages/%s\n" "$pkg" "$pkg"
            done
          } > "$root/example/pubspec_overrides.yaml"
      - name: pub get
        run: |
          for pkg in packages/*/; do
            flutter pub get --no-precompile -C "$pkg"
          done
          flutter pub get --no-precompile -C example
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages/ example/

  packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - calendar_utils
          - core
          - design_system
          - firebase_packages
          - global_lints
          - social_login
          - ui_kit
          - ui_kit_interface
          - user_auth

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create local dependency overrides
        run: |
          root="${{ github.workspace }}/packages"
          write_overrides() {
            local pkg=$1; shift
            { echo "dependency_overrides:"
              for dep in "$@"; do printf "  %s:\n    path: ../%s\n" "$dep" "$dep"; done
            } > "$root/$pkg/pubspec_overrides.yaml"
          }
          write_overrides core              global_lints
          write_overrides design_system     global_lints
          write_overrides firebase_packages core global_lints
          write_overrides social_login      core global_lints
          write_overrides ui_kit            design_system ui_kit_interface global_lints
          write_overrides ui_kit_interface  design_system global_lints
          write_overrides user_auth         ui_kit_interface design_system core global_lints

      - name: pub get
        working-directory: packages/${{ matrix.package }}
        run: flutter pub get

      - name: analyze
        working-directory: packages/${{ matrix.package }}
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: test
        if: matrix.package == 'calendar_utils'
        working-directory: packages/calendar_utils
        run: dart test --coverage=coverage

      - name: format coverage
        if: matrix.package == 'calendar_utils'
        working-directory: packages/calendar_utils
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json \
            --report-on=lib

      - name: upload coverage
        if: matrix.package == 'calendar_utils'
        uses: codecov/codecov-action@v4
        with:
          files: packages/calendar_utils/coverage/lcov.info
          flags: calendar_utils
          token: ${{ secrets.CODECOV_TOKEN }}

  example:
    name: example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create local dependency overrides
        run: |
          root="${{ github.workspace }}"
          { echo "dependency_overrides:"
            for pkg in calendar_utils core design_system firebase_packages \
                       social_login ui_kit ui_kit_interface user_auth global_lints; do
              printf "  %s:\n    path: ../packages/%s\n" "$pkg" "$pkg"
            done
          } > "$root/example/pubspec_overrides.yaml"

      - name: pub get
        working-directory: example
        run: flutter pub get

      - name: analyze
        working-directory: example
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

  build_apk:
    name: build apk
    runs-on: ubuntu-latest
    needs: [packages, example]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create local dependency overrides
        run: |
          root="${{ github.workspace }}"
          { echo "dependency_overrides:"
            for pkg in calendar_utils core design_system firebase_packages \
                       social_login ui_kit ui_kit_interface user_auth global_lints; do
              printf "  %s:\n    path: ../packages/%s\n" "$pkg" "$pkg"
            done
          } > "$root/example/pubspec_overrides.yaml"

      - name: pub get
        working-directory: example
        run: flutter pub get

      - name: build apk
        working-directory: example
        run: flutter build apk --debug

  build_ios:
    name: build ios
    runs-on: macos-latest
    needs: [packages, example]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Create local dependency overrides
        run: |
          root="${{ github.workspace }}"
          { echo "dependency_overrides:"
            for pkg in calendar_utils core design_system firebase_packages \
                       social_login ui_kit ui_kit_interface user_auth global_lints; do
              printf "  %s:\n    path: ../packages/%s\n" "$pkg" "$pkg"
            done
          } > "$root/example/pubspec_overrides.yaml"

      - name: pub get
        working-directory: example
        run: flutter pub get

      - name: build ios
        working-directory: example
        run: flutter build ios --no-codesign --debug

  tag:
    name: tag
    runs-on: ubuntu-latest
    needs: [format, packages, example, build_apk, build_ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          echo "value=$(grep '^version:' packages/core/pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.value }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.value }}"
          git push origin "${{ steps.version.outputs.value }}"
